<section class="weather">
  <h2>Budapest Weather</h2>

  <!-- Loading Spinner -->
  <div *ngIf="isLoading">Loading weather data...</div>

  <!-- Error Message -->
  <div *ngIf="errorMessage" class="error">
    {{ errorMessage }}
  </div>

  <!-- Weather Data (Top 10 Values) -->
  <table *ngIf="topWeatherData" class="weather-table">
    <thead>
      <tr>
        <th>Time</th>
        <th>Temperature (°C)</th>
        <th>Precipitation (mm)</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let time of topWeatherData.time; let i = index">
        <td>{{ time }}</td>
        <td>{{ topWeatherData.temperature_2m[i] }}</td>
        <td>{{ topWeatherData.precipitation[i] }}</td>
      </tr>
    </tbody>
  </table>

  <!-- No Data Available -->
  <div *ngIf="!isLoading && !topWeatherData">
    <p>No weather data available.</p>
  </div>
</section>
